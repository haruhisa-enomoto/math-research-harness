[project]
name = "math-research-harness"
version = "0.1.0"
description = "A starting point for owner-directed mathematical research with AI agents"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "fonttools>=4.40",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
